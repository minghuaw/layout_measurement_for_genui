<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>头像堆叠过度-横向负边距</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; padding-bottom: 12px; }
.header { padding: 16px; background: #fff; }
.header h1 { font-size: 20px; }
.header p { margin-top: 4px; font-size: 13px; color: #5f6368; }

/* 缺陷植入：头像堆叠 margin-left: -36px，48px 头像仅露出 12px，
   相邻头像交叠占比较小元素 75%，人脸互相遮挡，属真实缺陷 */
.crew { margin: 12px; padding: 16px 14px; background: #fff; border-radius: 12px; }
.crew h2 { font-size: 15px; }
.crew p { margin-top: 4px; font-size: 12px; color: #6b7280; }
.avatar-row { margin-top: 12px; display: flex; }
.avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; }
.avatar + .avatar { margin-left: -36px; }
/* 三色循环（蓝/红/绿，色相聚簇成和声）便于观察遮挡，又不引入 HARMONY_OFF 噪声 */
.a1 { background: #2563eb; }
.a2 { background: #d93036; }
.a3 { background: #16a34a; }
.a4 { background: #2563eb; }
.a5 { background: #d93036; }
.crew-note { margin-top: 10px; font-size: 12px; color: #6b7280; }

.card-list { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
.card { background: #fff; border-radius: 12px; padding: 14px; }
.card-head { display: flex; gap: 12px; }
.thumb { width: 64px; height: 64px; border-radius: 8px; background: #dbeafe; flex-shrink: 0; }
.card-info { flex: 1; min-width: 0; }
.card-info h3 { font-size: 15px; line-height: 1.4; }
.card-info .desc { margin-top: 6px; font-size: 13px; color: #6b7280; line-height: 1.4; }
.card-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
.price { color: #d93036; font-size: 17px; font-weight: 600; }
.price small { font-size: 12px; font-weight: 400; }
.btn { height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; }

.tabbar { margin-top: 12px; display: flex; background: #fff; border-radius: 12px; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 56px; text-decoration: none; color: #6b7280; font-size: 10px; }
.tabbar .icon { font-size: 18px; }
</style>
</head>
<body>
<header class="header">
  <h1>结伴同游</h1>
  <p>找到你的出行搭子</p>
</header>
<section class="crew">
  <h2>本周同行小伙伴</h2>
  <p>已有 5 人加入本次徒步活动</p>
  <div class="avatar-row">
    <div class="avatar a1"></div>
    <div class="avatar a2"></div>
    <div class="avatar a3"></div>
    <div class="avatar a4"></div>
    <div class="avatar a5"></div>
  </div>
  <p class="crew-note">已有 12 位小伙伴加入本次行程</p>
</section>
<main class="card-list">
  <article class="card">
    <div class="card-head">
      <div class="thumb"></div>
      <div class="card-info">
        <h3>城市漫步指南</h3>
        <p class="desc">用半天时间探索老城区的街巷与咖啡馆，感受城市的另一面。</p>
      </div>
    </div>
    <div class="card-foot">
      <div class="price"><small>¥</small>29</div>
      <button class="btn">查看详情</button>
    </div>
  </article>
  <article class="card">
    <div class="card-head">
      <div class="thumb"></div>
      <div class="card-info">
        <h3>近郊徒步路线推荐</h3>
        <p class="desc">三条一日往返路线，难度适中，适合周末轻装出发。</p>
      </div>
    </div>
    <div class="card-foot">
      <div class="price"><small>¥</small>35</div>
      <button class="btn">查看详情</button>
    </div>
  </article>
</main>
<nav class="tabbar">
  <a href="#"><span class="icon">🏠</span><span>首页</span></a>
  <a href="#"><span class="icon">🧭</span><span>发现</span></a>
  <a href="#"><span class="icon">☆</span><span>收藏</span></a>
  <a href="#"><span class="icon">⚙</span><span>我的</span></a>
</nav>
</body>
</html>
