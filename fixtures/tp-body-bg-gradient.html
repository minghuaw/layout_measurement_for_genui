<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tp-body-bg-gradient</title>
<style>
  * { box-sizing: border-box; }
  /* body 渐变底色——文字直接置于其上，应继承 body 的渐变 stop 参与对比度判定 */
  body { margin: 0; background: linear-gradient(180deg, #14323a 0%, #dca44c 100%); color: #ede3d0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <h1>田园美居指南</h1>
  <p>200㎡ 三代同堂的美式田园，一次读懂。文字位于 body 渐变底色之上。</p>
</body>
</html>
