<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡片流-颜色混乱</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; padding-bottom: 12px; }
.header { padding: 16px; background: #fff; }
.header h1 { font-size: 20px; }
.header p { margin-top: 4px; font-size: 13px; color: #5f6368; }
.card-list { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
.card { background: #fff; border-radius: 12px; padding: 14px; }
.card h3 { font-size: 15px; line-height: 1.4; }
.card:nth-child(1) h3 { color: #e02020; }
.card:nth-child(2) h3 { color: #16a34a; }
.card:nth-child(3) h3 { color: #2563eb; }
.card:nth-child(4) h3 { color: #f59e0b; }
.card .desc { margin-top: 6px; font-size: 13px; color: #6b7280; line-height: 1.4; }
.badge { display: inline-block; margin-top: 8px; font-size: 11px; padding: 2px 8px; border-radius: 10px; color: #fff; }
.card:nth-child(1) .badge { background: #7c3aed; }
.card:nth-child(2) .badge { background: #0d9488; }
.card:nth-child(3) .badge { background: #7c3aed; }
.card:nth-child(4) .badge { background: #0d9488; }
.card-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
.price { color: #d93036; font-size: 17px; font-weight: 600; }
.price small { font-size: 12px; font-weight: 400; }
.btn { height: 44px; padding: 0 18px; border: none; border-radius: 8px; color: #ffffff; font-size: 14px; }
.card:nth-child(1) .btn { background: #e02020; }
.card:nth-child(2) .btn { background: #16a34a; }
.card:nth-child(3) .btn { background: #2563eb; }
.card:nth-child(4) .btn { background: #f59e0b; }
.tabbar { margin-top: 12px; display: flex; background: #fff; border-radius: 12px; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 56px; text-decoration: none; color: #6b7280; font-size: 10px; }
.tabbar .icon { font-size: 18px; }
</style>
</head>
<body>
<header class="header">
  <h1>今日推荐</h1>
  <p>为你精选的 4 条内容</p>
</header>
<main class="card-list">
  <article class="card">
    <h3>城市漫步指南</h3>
    <p class="desc">用半天时间探索老城区的街巷与咖啡馆。</p>
    <span class="badge">精选</span>
    <div class="card-foot">
      <div class="price"><small>¥</small>29</div>
      <button class="btn">查看详情</button>
    </div>
  </article>
  <article class="card">
    <h3>周末市集活动预告</h3>
    <p class="desc">本周末两天，近 40 家摊主集结。</p>
    <span class="badge">本地</span>
    <div class="card-foot">
      <div class="price"><small>¥</small>19</div>
      <button class="btn">查看详情</button>
    </div>
  </article>
  <article class="card">
    <h3>手冲咖啡入门课</h3>
    <p class="desc">从磨豆到注水，两小时入门手冲。</p>
    <span class="badge">新手</span>
    <div class="card-foot">
      <div class="price"><small>¥</small>49</div>
      <button class="btn">查看详情</button>
    </div>
  </article>
  <article class="card">
    <h3>近郊徒步路线推荐</h3>
    <p class="desc">三条一日往返路线，难度适中。</p>
    <span class="badge">户外</span>
    <div class="card-foot">
      <div class="price"><small>¥</small>35</div>
      <button class="btn">查看详情</button>
    </div>
  </article>
</main>
<nav class="tabbar">
  <a href="#"><span class="icon">🏠</span><span>首页</span></a>
  <a href="#"><span class="icon">🧭</span><span>发现</span></a>
  <a href="#"><span class="icon">☆</span><span>收藏</span></a>
  <a href="#"><span class="icon">⚙</span><span>我的</span></a>
</nav>
</body>
</html>
