<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tp-group-child-align</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1e2a23; color: #ede3d0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .board { text-align: left; background: #28352d; border-radius: 10px; padding: 16px; border: 1px solid #48584c; min-width: 0;
           display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; align-items: center; gap: 8px; color: #dca44c; }
  .tmd-icon { display: inline-block; width: 20px; height: 20px; background-color: #dca44c;
              -webkit-mask-image: url(icon-assets/arrow-left.svg); mask-image: url(icon-assets/arrow-left.svg);
              -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .label { font-size: 12px; color: #8e9c8c; letter-spacing: 0.06em; }
  .title { font-weight: 600; font-size: 17px; color: #ede3d0; }
  .summary { font-size: 13px; color: #c4cdba; line-height: 1.6; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
</style>
</head>
<body>
  <div class="grid">
    <button class="board" data-testid="style-board">
      <span class="head"><span class="tmd-icon"></span><span class="label">风格定位</span></span>
      <span class="title">风格解析</span>
      <span class="summary">美式田园的灵魂是回归自然、温馨舒适，可视为美式乡村的同源变体。</span>
    </button>
    <button class="board" data-testid="space-board">
      <span class="head"><span class="tmd-icon"></span><span class="label">入户区</span></span>
      <span class="title">空间方案</span>
      <span class="summary">全屋收纳的第一站，承担鞋帽、外套、雨具与访客的第一眼观感。</span>
    </button>
    <button class="board" data-testid="family-board">
      <span class="head"><span class="tmd-icon"></span><span class="label">共通</span></span>
      <span class="title">空间独立充足</span>
      <span class="summary">三代人作息不同，各自都需要独立安静的空间来休息和生活。</span>
    </button>
    <button class="board" data-testid="budget-board">
      <span class="head"><span class="tmd-icon"></span><span class="label">以实用为先的经济投入，满足基本居住功能的量级。</span></span>
      <span class="title">装修预算</span>
      <span class="summary">以实用为先的经济投入，满足基本居住功能的量级。</span>
    </button>
  </div>
</body>
</html>
