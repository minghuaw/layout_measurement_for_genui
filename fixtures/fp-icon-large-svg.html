<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fp-icon-large-svg</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1e2a23; color: #ede3d0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 20px; }
  /* 大尺寸 SVG 插画（非图标）——不应触发 SVG_ICON_HINT */
  .illustration { width: 200px; height: 200px; display: block; }
  p { font-size: 14px; line-height: 1.6; margin: 12px 0 0; color: #c4cdba; }
</style>
</head>
<body>
  <img class="illustration" src="icon-assets/arrow-left.svg" alt="示意图">
  <p>大尺寸 SVG 插画，按尺寸启发不应被视为图标。</p>
</body>
</html>
