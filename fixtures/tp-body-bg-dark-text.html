<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tp-body-bg-dark-text</title>
<style>
  * { box-sizing: border-box; }
  /* 页面底色由 html/body 提供（无内容包裹层）——文字直接置于其上 */
  html { background: #14323a; }
  body { margin: 0; background: #1e2a23; color: #ede3d0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; margin: 0; color: #c4cdba; }
</style>
</head>
<body>
  <h1>田园美居指南</h1>
  <p>200㎡ 三代同堂的美式田园，一次读懂。页面底色由 html/body 提供，文字直接置于其上，不应被判为白底浅字。</p>
</body>
</html>
