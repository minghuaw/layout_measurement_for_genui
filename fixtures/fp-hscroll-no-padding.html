<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fp-hscroll-no-padding</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; }
  /* 水平滑动容器：无左内边距，首项紧贴屏幕左缘 */
  .scroll { display: flex; gap: 12px; overflow-x: auto; padding-left: 0; }
  .item { flex: 0 0 auto; width: 120px; height: 80px; background: #e8f0fe; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #222; }
</style>
</head>
<body>
<div class="scroll">
  <div class="item">Item 1</div>
  <div class="item">Item 2</div>
  <div class="item">Item 3</div>
  <div class="item">Item 4</div>
  <div class="item">Item 5</div>
</div>
</body>
</html>
