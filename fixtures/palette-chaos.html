<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡片流-配色失衡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; padding-bottom: 12px; }
.header { padding: 16px; background: #fff; }
.header h1 { font-size: 20px; }
.header p { margin-top: 4px; font-size: 13px; color: #5f6368; }
.card-list { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
.card { background: #fff; border-radius: 12px; padding: 14px; }
.banner { height: 120px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 15px; }
.card:nth-child(1) .banner { background: #ff3b30; }
.card:nth-child(2) .banner { background: #29cc6a; }
.card:nth-child(3) .banner { background: #3b82f6; }
.card:nth-child(4) .banner { background: #a855f7; }
.card h3 { margin-top: 12px; font-size: 15px; line-height: 1.4; }
.card p { margin-top: 6px; font-size: 13px; color: #6b7280; line-height: 1.4; }
.tabbar { margin-top: 12px; display: flex; background: #fff; border-radius: 12px; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 56px; text-decoration: none; color: #6b7280; font-size: 10px; }
.tabbar .icon { font-size: 18px; }
</style>
</head>
<body>
<header class="header">
  <h1>今日推荐</h1>
  <p>为你精选的 4 条内容</p>
</header>
<main class="card-list">
  <article class="card">
    <div class="banner">热门活动</div>
    <h3>城市漫步指南</h3>
    <p>用半天时间探索老城区的街巷与咖啡馆。</p>
  </article>
  <article class="card">
    <div class="banner">新品首发</div>
    <h3>周末市集活动预告</h3>
    <p>本周末两天，近 40 家摊主集结。</p>
  </article>
  <article class="card">
    <div class="banner">限时折扣</div>
    <h3>手冲咖啡入门课</h3>
    <p>从磨豆到注水，两小时入门手冲。</p>
  </article>
  <article class="card">
    <div class="banner">会员专享</div>
    <h3>近郊徒步路线推荐</h3>
    <p>三条一日往返路线，难度适中。</p>
  </article>
</main>
<nav class="tabbar">
  <a href="#"><span class="icon">🏠</span><span>首页</span></a>
  <a href="#"><span class="icon">🧭</span><span>发现</span></a>
  <a href="#"><span class="icon">☆</span><span>收藏</span></a>
  <a href="#"><span class="icon">⚙</span><span>我的</span></a>
</nav>
</body>
</html>
