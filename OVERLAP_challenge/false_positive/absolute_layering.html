<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绝对定位分层-背景+内容</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #222; padding-bottom: 12px; }

/* 场景说明：每个 section 内部用一个 absolute 背景层 + relative 内容层，
   两层是同父兄弟，矩形完全重叠，但这是标准的分层渲染设计。 */
.section { position: relative; margin: 12px; border-radius: 12px; overflow: hidden; }
.bg-layer { position: absolute; inset: 0; background: linear-gradient(135deg, #667eea, #764ba2); }
.content { position: relative; z-index: 1; padding: 20px 16px; }
.content h2 { font-size: 18px; color: #fff; }
.content p { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.85); line-height: 1.5; }

.card-list { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
.card { position: relative; border-radius: 12px; overflow: hidden; }
.card .bg { position: absolute; inset: 0; background: #fff; }
.card .body { position: relative; z-index: 1; padding: 14px; }
.card .body h3 { font-size: 15px; }
.card .body p { margin-top: 6px; font-size: 13px; color: #6b7280; line-height: 1.4; }

.tabbar { margin-top: 12px; display: flex; background: #fff; border-radius: 12px; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 56px; text-decoration: none; color: #6b7280; font-size: 10px; }
.tabbar .icon { font-size: 18px; }
</style>
</head>
<body>

<div class="section">
  <div class="bg-layer"></div>
  <div class="content">
    <h2>精选好物</h2>
    <p>每日更新，为你推荐最值得入手的好东西。</p>
  </div>
</div>

<main class="card-list">
  <article class="card">
    <div class="bg"></div>
    <div class="body">
      <h3>无线降噪耳机</h3>
      <p>主动降噪，30 小时续航，沉浸式音乐体验。</p>
    </div>
  </article>
  <article class="card">
    <div class="bg"></div>
    <div class="body">
      <h3>智能手环 Pro</h3>
      <p>心率监测、血氧检测，14 天超长续航。</p>
    </div>
  </article>
  <article class="card">
    <div class="bg"></div>
    <div class="body">
      <h3>便携蓝牙音箱</h3>
      <p>IPX7 防水，360 度环绕音效，户外好伴侣。</p>
    </div>
  </article>
  <article class="card">
    <div class="bg"></div>
    <div class="body">
      <h3>快充移动电源</h3>
      <p>20000mAh 大容量，65W 双向快充。</p>
    </div>
  </article>
</main>

<nav class="tabbar">
  <a href="#"><span class="icon">🏠</span><span>首页</span></a>
  <a href="#"><span class="icon">🧭</span><span>发现</span></a>
  <a href="#"><span class="icon">☆</span><span>收藏</span></a>
  <a href="#"><span class="icon">⚙</span><span>我的</span></a>
</nav>
</body>
</html>
